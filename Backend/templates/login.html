<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            text-align:center;
            padding-top:80px;
        }

        input{
            width:300px;
            padding:12px;
            margin:10px;
            border:none;
            border-radius:6px;
        }

        button{
            padding:12px 30px;
            background:#38bdf8;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0284c7;
        }

        a{
            color:#38bdf8;
            text-decoration:none;
        }
    </style>
</head>

<body>

<h1>Student Login</h1>

<form method="POST">

<input type="email" name="email" placeholder="Email" required><br>

<input type="password" name="password" placeholder="Password" required><br><br>

<button type="submit">Login</button>

</form>

<br><br>

<a href="/">⬅ Back to Home</a>

</body>
</html>
